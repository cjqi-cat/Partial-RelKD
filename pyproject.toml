[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partial-relkd"
version = "0.1.0"
description = "Robust remote-sensing change captioning under unseen degradation families"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["partial_relkd*"]
